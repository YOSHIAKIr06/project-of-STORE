name: Bootstrap Firebase Deployment Routes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Create Firebase Hosting sites for ROUTE-01 to ROUTE-05
    runs-on: ubuntu-latest

    steps:
      - name: Validate shared Firebase configuration
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "FIREBASE_PROJECT_ID repository variable is not configured."
            exit 1
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT repository secret is not configured."
            exit 1
          fi

      - name: Configure Google credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Create Hosting sites if missing
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          set -e
          sites=(
            yoshiakir06-route01-2026
            yoshiakir06-route02-2026
            yoshiakir06-route03-2026
            yoshiakir06-route04-2026
            yoshiakir06-route05-2026
          )

          existing="$(firebase hosting:sites:list --project "$FIREBASE_PROJECT_ID" --json)"

          for site in "${sites[@]}"; do
            if echo "$existing" | grep -q "\"$site\""; then
              echo "$site already exists; skipping."
            else
              echo "Creating $site..."
              firebase hosting:sites:create "$site" --project "$FIREBASE_PROJECT_ID"
            fi
          done

      - name: Summary
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          echo "## Firebase deployment routes bootstrapped" >> "$GITHUB_STEP_SUMMARY"
          echo "Project: $FIREBASE_PROJECT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- ROUTE-01: yoshiakir06-route01-2026" >> "$GITHUB_STEP_SUMMARY"
          echo "- ROUTE-02: yoshiakir06-route02-2026" >> "$GITHUB_STEP_SUMMARY"
          echo "- ROUTE-03: yoshiakir06-route03-2026" >> "$GITHUB_STEP_SUMMARY"
          echo "- ROUTE-04: yoshiakir06-route04-2026" >> "$GITHUB_STEP_SUMMARY"
          echo "- ROUTE-05: yoshiakir06-route05-2026" >> "$GITHUB_STEP_SUMMARY"
